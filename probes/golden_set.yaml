version: "1.0.0"
description: "Canonical golden set for OpenViking retrieval quality evaluation (P-20261011-04 Phase 3)"
metadata:
  created_at: "2026-10-12"
  target_subsystem: "OpenViking Semantic Search & Context Retrieval"
  evaluation_metrics:
    - recall_at_1
    - recall_at_3
    - recall_at_5
    - mean_reciprocal_rank
    - score_separation

queries:
