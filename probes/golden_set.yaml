    query: "proposal P-20260927-01 cancellation"
    expected_uris:
      - "viking://resources/collab/receipts/2026-09-30-P-20260927-01-cancelled.md"
  - id: "Q04"
    category: "history"
    query: "per-agent user accounts architecture T-20260830-10"
    expected_uris:
      - "viking://resources/tasks-subset/T-20260830-10-per-agent-user-accounts/.abstract.md"
  - id: "Q05"
